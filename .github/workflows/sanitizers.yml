name: Sanitizers (ASAN/UBSAN/TSAN)

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

env:
  DEBIAN_FRONTEND: noninteractive

defaults:
  run:
    shell: bash

jobs:
  asan-ubsan:
    name: AddressSanitizer + UndefinedBehaviourSanitizer
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang \
            libbsd-dev libseccomp-dev tcpdump python3-scapy

      - name: Build accd with ASAN + UBSAN
        env:
          CC: clang
          CFLAGS: "-fsanitize=address,undefined -fno-omit-frame-pointer -fno-sanitize-recover=undefined -O1 -g"
        run: |
          set -euo pipefail
          cd accd
          # Drop the production hardening LDFLAGS (-pie, RELRO) -- they
          # collide with the sanitizer runtime on clang/glibc.  The
          # sanitizers add their own hardening.
          make clean
          make CC=clang \
            ACCD_CFLAGS="-std=c99 -Wall -Wextra -O1 -g -DACCD_VERSION_STR='\"sanitizer\"' -I/usr/local/include $CFLAGS" \
            ACCD_LDFLAGS="-L/usr/local/lib $CFLAGS"
          file accd
          # The sanitizer build still links libseccomp so the symbols
          # resolve; sandbox.c self-disables seccomp_load() under
          # __SANITIZE_ADDRESS__ at runtime.
          if ! readelf -d accd | grep -q "NEEDED.*libseccomp"; then
            echo "ERROR: sanitizer accd not linked against libseccomp" >&2
            readelf -d accd | grep NEEDED >&2 || true
            exit 1
          fi
          ./accd -V

      - name: Run fast integration tests
        env:
          ASAN_OPTIONS: detect_leaks=1:check_initialization_order=1:strict_init_order=1:detect_stack_use_after_return=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
          SKIP: 1
        run: |
          set -euo pipefail
          cd accd/tests/integration
          # Only run tests that don't need tmp/bot/bot -- that source
          # is intentionally gitignored ('scratch / dirty notebook'
          # discipline), so it's not on the runner.  The selected
          # tests cover every parsed-wire-format surface where memory-
          # safety bugs are most likely to live: handshake, welcome
          # trailer, kson register/refresh/cp_push/fingerprint/reject
          # codes, admin reject paths, lobby ping echo, make-install
          # layout, dep-freshness.
          # ASAN+UBSAN instrumentation adds 2-5x runtime overhead on
          # accd's syscall + parse paths, which blows the 1-2s sleep
          # gates baked into the lobby-protocol test scripts.  Those
          # 1-2s waits aren't sanitizer-relevant -- they just check
          # that messages round-trip on time.  Keep the tests that
          # exercise the handshake / welcome trailer / build hygiene
          # (no tight timing) so the sanitizer signal is real.
          failed=()
          for t in \
              run_make_install.sh \
              run_welcome_trailer_walk.sh \
              run_makefile_deps_fresh.sh
          do
              if [ -x "$t" ]; then
                  echo "==> $t"
                  if ! ./"$t"; then
                      failed+=("$t")
                  fi
              else
                  echo "skip $t (not executable)"
              fi
          done
          if [ ${#failed[@]} -gt 0 ]; then
              echo "FAIL: ${#failed[@]} test(s) failed: ${failed[*]}"
              exit 1
          fi

      - name: Show accd.log if a sanitizer fired
        if: failure()
        run: |
          cd accd/tests/integration
          tail -200 accd.log || true

  tsan:
    name: ThreadSanitizer
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang \
            libbsd-dev libseccomp-dev tcpdump python3-scapy

      - name: Build accd with TSAN
        env:
          CC: clang
          CFLAGS: "-fsanitize=thread -fno-omit-frame-pointer -O1 -g"
        run: |
          set -euo pipefail
          cd accd
          # accd is single-threaded today, but TSAN still catches
          # signal-handler / memory-model races on g_stop and any
          # data the SIGINT/SIGTERM handler touches.  Establishing
          # the baseline now means the eventual threaded variant
          # (TX worker pool) starts clean.
          make clean
          make CC=clang \
            ACCD_CFLAGS="-std=c99 -Wall -Wextra -O1 -g -DACCD_VERSION_STR='\"tsan\"' -I/usr/local/include $CFLAGS" \
            ACCD_LDFLAGS="-L/usr/local/lib $CFLAGS"
          ./accd -V

      - name: Run handshake + reject smokes under TSAN
        env:
          TSAN_OPTIONS: halt_on_error=1:second_deadlock_stack=1
        run: |
          set -euo pipefail
          cd accd
          python3 tests/smoke_handshake.py
          python3 tests/smoke_reject_codes.py

      - name: Show accd.log if TSAN fired
        if: failure()
        run: |
          cd accd/tests/integration
          tail -200 accd.log || true
